spring.application.name=lms
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-1234567890}

spring.jackson.serialization.write-dates-as-timestamps=false
